# ============================================================================
# Netlify Configuration for Standalone Public Hotel Website
# Connect your Git repository to Netlify and set Base directory to:
#   hotel-public-site
# ============================================================================

[build]
  base = "hotel-public-site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Caching Headers for Static Assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
